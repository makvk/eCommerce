name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ECommerceStore.sln

      - name: Build
        run: dotnet build ECommerceStore.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ECommerceStore.sln --no-build --configuration Release --verbosity normal

  notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest
